name: Feature request
description: Suggest an improvement or new capability for Mneme.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please search existing issues first.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem would this feature solve, and who would benefit?
      placeholder: Describe the use case and current limitation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour or workflow you would like to see.
      placeholder: Explain your proposed solution, including examples where useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative solutions have you tried?

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched the existing issues.
          required: true
