name: tests

# Runs the canonical pytest suite (pyproject [tool.pytest.ini_options]
# testpaths = ["tests"]) on every PR to main and on direct pushes to main.
#
# CONTRIBUTING.md requires all tests to pass before a pull request can be
# merged; this workflow makes that requirement enforceable in CI. The
# benchmark suite is intentionally not invoked here — it is a separate
# charter instrument (see CONTRIBUTING.md and the Layer 1 freeze docs).
#
# Python 3.11 is the declared minimum (requires-python >= 3.11).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

      # Temporary branch-only validation for PR #327. Remove after the
      # documented quickstart has been exercised end-to-end.
      - name: Exercise five-minute quickstart
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"

          mneme init
          mneme add_decision \
            --memory .mneme/project_memory.json \
            --id config-format \
            --decision "Use JSON for configuration files" \
            --scope config \
            --constraint "Use JSON only" \
            --anti-pattern "Do not use YAML"

          python -c "import pathlib; pathlib.Path('prompt_clean.txt').write_text('Add a new JSON config file', encoding='utf-8')"
          clean_output="$(mneme check --memory .mneme/project_memory.json --input prompt_clean.txt --query configuration)"
          printf '%s\n' "$clean_output"
          grep -q "Result: PASS" <<<"$clean_output"

          python -c "import pathlib; pathlib.Path('prompt_violation.txt').write_text('Set up a new YAML config file for this module', encoding='utf-8')"
          set +e
          violation_output="$(mneme check --memory .mneme/project_memory.json --input prompt_violation.txt --query configuration 2>&1)"
          violation_rc=$?
          set -e
          printf '%s\n' "$violation_output"
          test "$violation_rc" -eq 2
          grep -q "Result: FAIL" <<<"$violation_output"

  # The LangChain integration's live governed-loop tests require the
  # optional extra; the canonical job above intentionally runs without it.
  pytest-langchain:
    name: pytest (langchain extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package with dev and langchain extras
        run: python -m pip install -e ".[dev,langchain]"

      - name: Run LangChain integration tests
        run: python -m pytest tests/integrations/langchain
