name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Tell mnemehq.com a new core is out, so its agent-discovery check runs
      # now instead of at the next daily cron (which remains the fallback).
      # Non-fatal: a token problem must never fail a PyPI publish that has
      # already happened, so failures surface as a warning annotation only.
      - name: Notify mnemehq-site of the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # The version PyPI received, read from the sdist just uploaded.
          sdist=$(basename dist/*.tar.gz .tar.gz)
          version=${sdist##*-}
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Site dispatch skipped::SITE_DISPATCH_TOKEN is not set; mnemehq-site was not notified of mneme-hq $version. Its daily check will catch the release instead."
            exit 1
          fi
          if ! gh api repos/MnemeHQ/mnemehq-site/dispatches \
              -f event_type=core-released \
              -f "client_payload[version]=$version"; then
            echo "::warning title=Site dispatch failed::Could not send core-released for mneme-hq $version to MnemeHQ/mnemehq-site (check SITE_DISPATCH_TOKEN access). Its daily check will catch the release instead."
            exit 1
          fi
          echo "Sent core-released (version $version) to MnemeHQ/mnemehq-site."
